<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <title>captureVisibleTab 探针结果</title>
    <style>
      body {
        font: 14px/1.6 system-ui, -apple-system, 'Segoe UI', sans-serif;
        margin: 0;
        padding: 24px;
        max-width: 760px;
        color: #18181b;
      }
      h1 {
        font-size: 18px;
        margin: 0 0 4px;
      }
      .verdict {
        display: inline-block;
        padding: 3px 10px;
        border-radius: 6px;
        background: #eef2ff;
        color: #3730a3;
        font-weight: 600;
        margin-bottom: 12px;
      }
      .interp {
        margin: 0 0 16px;
        padding: 10px 12px;
        background: #fafafa;
        border: 1px solid #e4e4e7;
        border-radius: 8px;
      }
      table {
        border-collapse: collapse;
        width: 100%;
        margin-bottom: 16px;
      }
      th,
      td {
        text-align: left;
        padding: 6px 8px;
        border-bottom: 1px solid #e4e4e7;
        font-size: 13px;
      }
      th {
        background: #fafafa;
        font-weight: 600;
      }
      code {
        font: 12px/1.5 ui-monospace, SFMono-Regular, Menlo, monospace;
      }
      button {
        font: inherit;
        padding: 6px 14px;
        border-radius: 6px;
        border: 1px solid #2563eb;
        background: #2563eb;
        color: #fff;
        cursor: pointer;
      }
      .hint {
        color: #52525b;
        font-size: 12px;
        margin-top: 12px;
      }
      .busy {
        color: #52525b;
      }
    </style>
  </head>
  <body>
    <h1>captureVisibleTab 频率探针</h1>
    <p id="status" class="busy">正在读取结果…</p>

    <div id="content" hidden>
      <div id="verdict" class="verdict"></div>
      <p id="interp" class="interp"></p>

      <table>
        <thead>
          <tr>
            <th>轮次</th>
            <th>尝试</th>
            <th>成功</th>
            <th>失败</th>
            <th>失败率</th>
            <th>中位耗时</th>
            <th>失败出现在第几次</th>
          </tr>
        </thead>
        <tbody id="rows"></tbody>
      </table>

      <p id="errors" class="hint"></p>

      <button id="copy" type="button">复制完整 JSON 到剪贴板</button>
      <p class="hint">
        同时已经下载了一份 <code>capture-visible-tab-probe.json</code>。<br />
        把 JSON 文件、或点上面的按钮后粘贴的内容，发给提出这次实测的人即可。<br />
        跑完可以在 <code>chrome://extensions</code> 里直接「移除」这个探针扩展。
      </p>
      <pre id="json" hidden></pre>
    </div>

    <script src="result.js"></script>
  </body>
</html>
